<title id="t">Lucas N. Munhoz: productivity tools and passion projects, Bangkok</title>
<desc id="d">A city skyline where each building is one week of GitHub contributions over the past year. 2,776 contributions in total; the busiest week, starting 2026-11-08, had 685.</desc>
